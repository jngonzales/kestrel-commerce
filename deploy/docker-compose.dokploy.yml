# Same stack as docker-compose.yml, without host `ports:`, for Dokploy, Coolify and other platforms whose proxy
# routes domains to containers over the Docker network. Published host ports (3000, 4600, 4700, 4900) collide with the
# proxy or with other apps on the server and fail the first deploy. Add domains in the platform instead:
# kestrel -> 3000, stripe -> 4600, cj-dropshipping -> 4700, shippo -> 4900, reviews -> 5100. Keep the rest in sync with docker-compose.yml.
# Set APP_URL and STRIPE_APP_URL, and pin KESTREL_VERSION to a release tag (for example v1.2.3).
# Optional apps are off by default. CJ Dropshipping: COMPOSE_PROFILES=cj, plus CJ_DROPSHIPPING_APP_URL for its domain.
# Shippo: COMPOSE_PROFILES=shippo (comma-separate to enable both), plus SHIPPO_APP_URL.
# The services that get a domain are also on `dokploy-network`, which is how the proxy (Traefik) reaches them; without
# it the domain answers 502 or 404. `default` stays in each list: it is how they reach `db` and each other.
# Each app has its own private key: set STRIPE_APP_KEY=snxk_… in .env (CJ_DROPSHIPPING_APP_KEY and
# SHIPPO_APP_KEY for those profiles). Make one with:
#   node -e "crypto.subtle.generateKey('Ed25519',true,['sign']).then(async k=>console.log('snxk_'+Buffer.from(await crypto.subtle.exportKey('pkcs8',k.privateKey)).toString('base64url')))"
# Keep it with your other secrets: it seals the keys merchants save in the app (Kestrel stores them sealed, so a copy of
# its database alone cannot unseal them), and a new key makes it a new app, so merchants reconnect. Only CJ
# Dropshipping has tables of its own (a schema in this Postgres); no app writes to a volume.
name: kestrel

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kestrel']
      interval: 5s
      timeout: 5s
      retries: 10

  kestrel:
    image: ghcr.io/kestrel-labs/kestrel:${KESTREL_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    networks: [default, dokploy-network]
    volumes:
      - kestrel_data:/data
    environment:
      DATABASE_URL: postgres://kestrel:kestrel@db:5432/kestrel
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      KESTREL_SECRET: ${KESTREL_SECRET:-}
      # Multi-shop (a public demo or SaaS): TENANCY_MODE=multi, OPEN_SIGNUP=true lets anyone create a shop, ROOT_DOMAIN
      # serves every shop at <slug>.ROOT_DOMAIN (see docs: Concepts > Tenancy). The defaults keep a single shop.
      TENANCY_MODE: ${TENANCY_MODE:-single}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      # The one host that serves /admin (others redirect to it). Defaults to the host of APP_URL in multi mode.
      ADMIN_HOST: ${ADMIN_HOST:-}
      # Open sign-up limits (OPEN_SIGNUP=true): per address and for everyone, per hour. Behind Cloudflare set
      # CLIENT_IP_HEADER=cf-connecting-ip so each visitor is told apart (see docs: Concepts > Tenancy).
      SIGNUP_RATE_PER_IP: ${SIGNUP_RATE_PER_IP:-}
      SIGNUP_RATE_GLOBAL: ${SIGNUP_RATE_GLOBAL:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      DEFAULT_SHOP_NAME: ${DEFAULT_SHOP_NAME:-My Shop}
      # Look for the bundled apps (stripe, cj-dropshipping, shippo) at their service names on this network
      KESTREL_BUNDLED_APPS: docker
    # Multi-shop only (TENANCY_MODE=multi): routes every <slug>.ROOT_DOMAIN to this service, next to the domain added
    # in Dokploy (the admin). ROOT_DOMAIN is the bare domain, e.g. kestrel.app, with a wildcard DNS record (*) pointing
    # at the server. With ROOT_DOMAIN unset it matches no host. priority=1 keeps the admin's own domain on its own route.
    # `$$` is a literal `$` in Compose. The router names its service because the container has several (Dokploy adds
    # its own for the admin domain), and Traefik won't pick one. Behind a CDN that terminates TLS (Cloudflare, SSL mode
    # Full) the default certificate is enough: this route has no certificate resolver, as a wildcard needs DNS-01.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.kestrel-shops.rule=HostRegexp(`^[a-z0-9-]+\.${ROOT_DOMAIN:-none}$$`)
      - traefik.http.routers.kestrel-shops.entrypoints=websecure
      - traefik.http.routers.kestrel-shops.tls=true
      - traefik.http.routers.kestrel-shops.priority=1
      - traefik.http.routers.kestrel-shops.service=kestrel-shops
      - traefik.http.services.kestrel-shops.loadbalancer.server.port=3000

  stripe:
    image: ghcr.io/kestrel-labs/kestrel-stripe:${KESTREL_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    environment:
      STRIPE_APP_URL: ${STRIPE_APP_URL:-http://localhost:4600}
      KESTREL_INTERNAL_URL: http://kestrel:3000
      STRIPE_APP_KEY: '${STRIPE_APP_KEY:?Set STRIPE_APP_KEY in .env, the private key of the Stripe app (see the top of this file)}'

  cj-dropshipping:
    profiles: [cj]
    image: ghcr.io/kestrel-labs/kestrel-cj-dropshipping:${KESTREL_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    depends_on:
      db: { condition: service_healthy }
    environment:
      CJ_DROPSHIPPING_APP_URL: ${CJ_DROPSHIPPING_APP_URL:-http://localhost:4700}
      KESTREL_INTERNAL_URL: http://kestrel:3000
      PORT: 4700
      APP_DATABASE_URL: postgres://kestrel:kestrel@db:5432/kestrel
      CJ_DROPSHIPPING_APP_KEY: ${CJ_DROPSHIPPING_APP_KEY:-}

  shippo:
    profiles: [shippo]
    image: ghcr.io/kestrel-labs/kestrel-shippo:${KESTREL_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    environment:
      SHIPPO_APP_URL: ${SHIPPO_APP_URL:-http://localhost:4900}
      KESTREL_INTERNAL_URL: http://kestrel:3000
      PORT: 4900
      SHIPPO_APP_KEY: ${SHIPPO_APP_KEY:-}

  reviews:
    profiles: [reviews]
    image: ghcr.io/kestrel-labs/kestrel-reviews:${KESTREL_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    depends_on:
      db: { condition: service_healthy }
    environment:
      REVIEWS_APP_URL: ${REVIEWS_APP_URL:-http://localhost:5100}
      KESTREL_INTERNAL_URL: http://kestrel:3000
      PORT: 5100
      APP_DATABASE_URL: postgres://kestrel:kestrel@db:5432/kestrel
      # Dokploy's Traefik sets x-forwarded-for: the rate limits tell visitors apart by it
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      REVIEWS_APP_KEY: ${REVIEWS_APP_KEY:-}

networks:
  dokploy-network:
    external: true

volumes:
  db:
  kestrel_data:
